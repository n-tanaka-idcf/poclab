# https://taskfile.dev

version: "3"

tasks:
  default:
    desc: Display a list of available tasks.
    cmds:
      - task --list-all --sort none

  environment:check:
    desc: Check if required tools are available.
    cmds:
      - gh --version
      - git --version
      - lefthook --version
      - nvim --version
      - rg --version
      - ssh -V
      - terraform --version
      - tflint --version

  environment:update:
    desc: Update environment tools.
    cmds:
      - aqua update

  lint:run:
    desc: |
      Run code linters.
      Usage: task lint:run
    cmds:
      - task: terraform:lint

  test:run:
    desc: |
      Run code tests.
      Usage: task test:run
    cmds:
      - echo "No tests defined yet."

  ci:run:
    desc: |
      Run the same checks and tests as in CI.
      Usage: task ci:run
    cmds:
      - task: lint:run
      - task: test:run

  pre-check:
    desc: Check prerequisites.
    cmds:
      - |
        missing_vars=0
        required_vars=(TF_VAR_api_key TF_VAR_secret_key TERRAFORM_TARGET_ENVIRONMENT)

        for required_var in "${required_vars[@]}"; do
          if [ -z "$(printenv "$required_var")" ]; then
            echo "ERROR: Required environment variable '$required_var' is not set."
            echo "Set it before running Terraform tasks. You can use .envrc_common_secrets.example as a template for the required secrets."
            missing_vars=1
          fi
        done

        if [ "$missing_vars" -ne 0 ]; then
          exit 1
        fi

  terraform:init:
    desc: |
      Run terraform init.
      Usage: task terraform:init
    deps:
      - pre-check
    cmds:
      - terraform init

  terraform:plan:
    desc: |
      Run terraform plan.
      Usage: task terraform:plan -- [terraform-plan-options]
    deps:
      - pre-check
    dir: environments/${TERRAFORM_TARGET_ENVIRONMENT}
    cmds:
      - terraform plan -var-file=terraform.tfvars {{.CLI_ARGS}}

  terraform:apply:
    desc: |
      Run terraform apply.
      Usage: task terraform:apply -- [terraform-apply-options]
    deps:
      - pre-check
    dir: environments/${TERRAFORM_TARGET_ENVIRONMENT}
    cmds:
      - terraform apply -var-file=terraform.tfvars {{.CLI_ARGS}}

  terraform:destroy:
    desc: |
      Run terraform destroy.
      Usage: CONFIRM_TERRAFORM_DESTROY=true task terraform:destroy -- [terraform-destroy-options]
      Safety: requires CONFIRM_TERRAFORM_DESTROY=true to reduce the risk of accidental destructive runs.
    deps:
      - pre-check
    dir: environments/${TERRAFORM_TARGET_ENVIRONMENT}
    cmds:
      - |
        test "${CONFIRM_TERRAFORM_DESTROY}" = "true" || {
          echo "Refusing to run terraform destroy without explicit confirmation."
          echo "Re-run with CONFIRM_TERRAFORM_DESTROY=true task terraform:destroy -- [terraform-destroy-options]"
          exit 1
        }
        terraform destroy -var-file=terraform.tfvars {{.CLI_ARGS}}

  terraform:lint:
    desc: |
      Run tflint.
      Usage: task terraform:lint -- [tflint-options]
    deps:
      - pre-check
    cmds:
      - tflint {{.CLI_ARGS}}
